<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Aspen Bear Week">
  <!--
    Leaf-and-paw. Metaphor fusion on a Bayer-style geometric construction: four
    toe circles of two radii on a symmetric arc, over a pad whose silhouette is an
    aspen leaf.

    The first attempt read as a paw with a slot, because the pad was taller than
    wide and tapered to a long point, which is a shield rather than a leaf. An
    aspen leaf is cordate: wider than tall, notched at the base. The notch does
    double duty, since it is also where a real pad meets the toes, and it is what
    makes the same shape legible as either thing.

    The midrib is cut as negative space rather than drawn in a second colour, so
    the mark survives on any ground. Thinnest feature is ~1.9px at 24px.
  -->
  <g fill="currentColor" fill-rule="evenodd">
    <circle cx="22" cy="35" r="10"/>
    <circle cx="40.5" cy="22.5" r="11"/>
    <circle cx="59.5" cy="22.5" r="11"/>
    <circle cx="78" cy="35" r="10"/>
    <path d="M50 89
             C 33 78, 22 68, 22 57.5
             C 22 47.5, 32 42, 42 42
             C 46 42, 48.6 45, 50 49.5
             C 51.4 45, 54 42, 58 42
             C 68 42, 78 47.5, 78 57.5
             C 78 68, 67 78, 50 89
             Z
             M50 83.5
             C 52.9 81.2, 53.9 79, 53.9 74.5
             L 53.9 60
             C 53.9 57.9, 52.2 56.5, 50 56.5
             C 47.8 56.5, 46.1 57.9, 46.1 60
             L 46.1 74.5
             C 46.1 79, 47.1 81.2, 50 83.5
             Z"/>
  </g>
</svg>
